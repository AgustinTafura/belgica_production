<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Lote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SPINNER -->
<div id="spinner-overlay">
  <div class="spinner-box">
    <div class="spinner"></div>
    <p class="spinner-text">Cargando lote...</p>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;">
  <header class="app-header">
    <div class="header-inner">
      <h1>✏️ Editar Lote</h1>
      <a href="index.html" class="btn-logout">← Volver</a>
    </div>
  </header>

  <main class="app-main">

    <div id="aviso-error" class="login-error" style="display:none;"></div>

    <form id="formEditar">

      <section class="card">
        <h2 class="section-title">📋 Datos del Lote</h2>

        <div class="campo-grupo">
          <label class="campo-label">Fecha</label>
          <input type="date" id="fecha" class="campo-input" required>
        </div>

        <div class="campo-grupo">
          <label class="campo-label">N° Lote</label>
          <input type="number" id="lote" class="campo-input" required readonly>
        </div>

        <div class="campo-grupo">
          <label class="campo-label">Vencimiento del lote</label>
          <input type="date" id="fechaVto" class="campo-input">
        </div>
      </section>

      <section class="card">
        <h2 class="section-title">🫙 Producción de Jarras</h2>

        <div class="campo-grupo">
          <label class="campo-label">Total Jarras</label>
          <input type="number" id="totalJarras" class="campo-input" required min="1">
        </div>

        <div id="sabores-container"></div>

        <button type="button" class="btn-agregar" onclick="agregarSaborSelector()">
          + Agregar Sabor
        </button>
      </section>

      <section class="card">
        <h2 class="section-title">🧪 Materias Primas</h2>
        <p class="ultimos-desc">Si no subís una foto nueva, se mantiene la imagen actual.</p>

        <div id="materias-container"></div>

        <button type="button" class="btn-agregar" onclick="agregarMateriaSelector()">
          + Agregar Materia Prima
        </button>
      </section>

      <div class="submit-area">
        <button type="submit" id="btn-submit" class="btn-submit">Guardar cambios</button>
        <button type="button" class="btn-agregar" onclick="irAEditarProduccion()">
          🧇 Editar producción (waffles) de este lote
        </button>
      </div>

    </form>
  </main>
</div>

<!-- MODAL ÉXITO -->
<div id="modal-exito" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div class="exito-icono">✅</div>
    <h2 class="modal-titulo">¡Cambios guardados!</h2>
    <p class="exito-desc">El lote fue actualizado en la planilla.</p>
    <button class="btn-submit" onclick="window.location.href='index.html'">Volver al inicio</button>
  </div>
</div>

<script src="config.js"></script>
<script src="editar.js"></script>
</body>
</html>
